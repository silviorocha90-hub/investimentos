name: Diagnostico Assistente IA Azure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-assistente-azure.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APORTIVAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APORTIVAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APORTIVAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Estado seguro da aplicacao
        shell: bash
        run: |
          az containerapp show --name aportiva-api --resource-group rg-aportiva-prod --query '{revision:properties.latestReadyRevisionName,active:properties.runningStatus,image:properties.template.containers[0].image,min:properties.template.scale.minReplicas,max:properties.template.scale.maxReplicas}' -o json
          az containerapp revision list --name aportiva-api --resource-group rg-aportiva-prod --query '[].{name:name,active:properties.active,runningState:properties.runningState,replicas:properties.replicas}' -o json
          echo 'Configuracao presente (apenas nomes, sem valores):'
          az containerapp show --name aportiva-api --resource-group rg-aportiva-prod --query 'properties.template.containers[0].env[].name' -o tsv | grep -E '^(ASPNETCORE_ENVIRONMENT|DOTNET_ENVIRONMENT|ASSISTENTE_IA_ATIVO|RESEND_API_KEY|EMAIL_FROM|OPENAI_API_KEY|OPENAI_MODEL|BRAPI_TOKEN|BRAPI_OPCOES_HABILITADAS)
 || true

      - name: Logs detalhados da API
        shell: bash
        run: |
          echo 'Capturando as ultimas 1000 linhas e mantendo contexto da chamada OpenAI.'
          az containerapp logs show --name aportiva-api --resource-group rg-aportiva-prod --type console --tail 1000 2>&1 \
            | grep -E -i -B 8 -A 25 'api\.openai\.com|OpenAI|Assistente|relat[oó]rio|HttpRequestException|InvalidOperationException|DbUpdateException|Exception|fail:|error|status(code)?|response|429|400|401|403|404|500' \
            | tail -500 || true
