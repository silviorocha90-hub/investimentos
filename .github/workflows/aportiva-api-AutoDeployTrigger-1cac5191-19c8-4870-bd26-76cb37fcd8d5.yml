name: Trigger auto deployment for aportiva-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APORTIVAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APORTIVAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APORTIVAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy aportiva-api
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Investimentos.Api/Dockerfile
          containerAppName: aportiva-api
          resourceGroup: rg-aportiva-prod
          targetPort: 8080
          ingress: external
