name: Trigger auto deployment for aportiva-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aportiva-api-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APORTIVAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APORTIVAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APORTIVAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: aportivacr.azurecr.io
          username: ${{ secrets.APORTIVA_ACR_USERNAME }}
          password: ${{ secrets.APORTIVA_ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Investimentos.Api/Dockerfile
          push: true
          tags: |
            aportivacr.azurecr.io/aportiva-api:${{ github.sha }}
            aportivacr.azurecr.io/aportiva-api:latest

      - name: Configure Container App registry
        run: >
          az containerapp registry set
          --name aportiva-api
          --resource-group rg-aportiva-prod
          --server aportivacr.azurecr.io
          --username "${{ secrets.APORTIVA_ACR_USERNAME }}"
          --password "${{ secrets.APORTIVA_ACR_PASSWORD }}"

      - name: Verify image was pushed
        run: >
          az acr repository show-tags
          --name aportivacr
          --repository aportiva-api
          --query "[?@=='${{ github.sha }}']"
          --output tsv | grep -Fx "${{ github.sha }}"

      - name: Deploy image to Container App
        run: >
          az containerapp update
          --name aportiva-api
          --resource-group rg-aportiva-prod
          --image aportivacr.azurecr.io/aportiva-api:${{ github.sha }}

      - name: Ensure external ingress on port 8080
        run: >
          az containerapp ingress enable
          --name aportiva-api
          --resource-group rg-aportiva-prod
          --type external
          --target-port 8080
